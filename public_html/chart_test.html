
<!-- VÄGA AJUTINE NÄIDE -->

<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridrush – hinnagraafiku test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    /* Veebilehe üldine kujundus */
    body {
      margin: 0;
      background: #111417;
      color: #e2e5e8;
      font: 14px Arial, sans-serif;
    }

    /* Veebilehe ülemine päis */
    header {
      border-bottom: 1px solid #30363d;
      padding: 18px 28px;
      font-size: 20px;
      font-weight: bold;
    }

    /* Peamise sisu paigutus */
    main {
      max-width: 1250px;
      margin: 38px auto;
      padding: 0 24px;
    }

    /* Pealkirja ja nuppude paigutus */
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }

    /* Kuupäevavalik ja graafiku juhtnupud */
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input, button, select {
      padding: 10px 12px;
      border-radius: 5px;
      border: 1px solid #38414a;
      color: #dce1e6;
      background: #1c2126;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: #313943;
    }

    button:hover:not(:disabled) {
      background: #414a54;
    }

    /* Mitteaktiivsed nupud */
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Graafiku paneel */
    .panel {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid #30363d;
      border-radius: 7px;
      background: #191d21;
    }

    /* Teadete ja statistika kujundus */
    #message, #stats {
      margin-top: 10px;
      color: #9ba5af;
    }

    /* Graafiku kõrgus */
    #price-container {
      position: relative;
      height: 440px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <!-- Veebilehe päis -->
  <header>
    GRIDRUSH
    <span style="color:#8b949e;font-size:12px;font-weight:normal">
      / Market
    </span>
  </header>

  <main>
    <div class="bar">
      <h1>Eesti elektri börsihind</h1>

      <!-- Graafiku juhtnupud -->
      <div class="controls">

        <!-- Valime kuupäeva -->
        <input type="date" id="date" value="2025-10-02">

        <!-- Laeme valitud päeva hinnad -->
        <button id="load">Laadi hinnad</button>

                <!-- Käivitame graafiku liikumise -->
        <button id="start" disabled>Start</button>

        <!-- Peatame graafiku -->
        <button id="pause" disabled>Pause</button>

        <!-- Alustame päeva algusest -->
        <button id="reset" disabled>Reset</button>

        <!-- Mängu kiiruse valimine -->
        <label for="speed">Kiirus:</label>

        <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="5">5×</option>
        </select>

      </div>
    </div>

    <!-- Hinnagraafiku paneel -->
    <div class="panel">

      <!-- Praegune mänguaeg ja teated -->
      <div id="message">Laen hindu…</div>

      <!-- Seni nähtud hindade statistika -->
      <div id="stats"></div>

      <!-- Graafiku joonistamise ala -->
      <div id="price-container">
        <canvas id="priceChart"></canvas>
      </div>

    </div>
  </main>

  <!-- Chart.js teek -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- Meie graafiku JavaScript -->
  <script src="js/chart.js"></script>

</body>
</html>
