/* VÄGA AJUTINE NÄIDE */

<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridrush – hinnagraafiku test</title>

  <style>
    
    * {
      box-sizing: border-box;
    }

    /* Veebilehe üldine kujundus */
    body {
      margin: 0;
      background: #111417;
      color: #e2e5e8;
      font: 14px Arial, sans-serif;
    }

    /* Veebilehe ülemise päise kujundus */
    header {
      border-bottom: 1px solid #30363d;
      padding: 18px 28px;
      font-size: 20px;
      font-weight: bold;
    }

    /* Peamise sisu paigutus ja maksimaalne laius */
    main {
      max-width: 1250px;
      margin: 38px auto;
      padding: 0 24px;
    }

    /* Pealkirja ja kuupäevavaliku paigutamine ühele reale */
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Hinnagraafiku pealkirja kujundus */
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }

    /* Kuupäevavaliku ja laadimisnupu paigutus */
    .controls {
      display: flex;
      gap: 8px;
    }

    /* Kuupäevavaliku ja nupu ühine kujundus */
    input, button {
      padding: 10px 12px;
      border-radius: 5px;
      border: 1px solid #38414a;
      color: #dce1e6;
      background: #1c2126;
      font: inherit;
    }

    /* Laadimisnupu kujundus */
    button {
      cursor: pointer;
      background: #313943;
    }

    /* Muudame nupu värvi, kui hiir on selle kohal */
    button:hover {
      background: #414a54;
    }

    /* Graafikut ja statistikat ümbritsev kujundus */
    .panel {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid #30363d;
      border-radius: 7px;
      background: #191d21;
    }

    /* Teadete ja hinnastatistika kujundus */
    #message, #stats {
      margin-top: 10px;
      color: #9ba5af;
    }

    /* Määrame hinnagraafiku jaoks kasutatava ala kõrguse */
    #price-container {
      position: relative;
      height: 440px;
      margin-top: 22px;
    }

    
    /* Ostu ja müügi testpaneel */
    .trade-title {
        font-size: 17px;
        margin: 0 0 12px;
    }

    .trade-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0;
    }

    .trade-info {
        justify-content: space-between;
    }

    .trade-info strong {
        font-size: 18px;
    }

    .trade-muted {
        color: #9ba5af;
    }

    .trade-divider {
        border: 0;
        border-top: 1px solid #30363d;
        margin: 18px 0;
    }

    /* OSTA ja MÜÜ nuppude värvid */
    #trade-buy {
        background: #17603d;
    }

    #trade-sell {
        background: #8a3838;
    }

    #trade-message {
        min-height: 20px;
        margin-top: 14px;
    }

  </style>
</head>

<body>
  <!-- Veebilehe päis koos Gridrushi nimega -->
  <header>
    GRIDRUSH
    <span style="color:#8b949e;font-size:12px;font-weight:normal">
      / Market
    </span>
  </header>

  <!-- Veebilehe peamine sisu -->
  <main>
    <div class="bar">
      <h1>Eesti elektri börsihind</h1>

      <!-- Kuupäeva valimine ja hindade laadimise nupp -->
      <div class="controls">
        <input type="date" id="date" value="2025-10-02">
        <button id="load">Laadi hinnad</button>
      </div>
    </div>

    <!-- Hinnagraafiku ja päeva statistika kuvamise paneel -->
    <div class="panel">
      <!-- Siin kuvatakse laadimisteated ja võimalikud veateated -->
      <div id="message">Laen hindu…</div>

      <!-- JavaScript lisab siia päeva hinnastatistika -->
      <div id="stats"></div>

      <!-- Canvas-element, millele JavaScript joonistab hinnagraafiku -->
      <div id="price-container">
        <canvas id="priceChart"></canvas>
      </div>
    </div>


    
    <!-- Ostu ja müügi testpaneel -->
    <div class="panel">

        <h2 class="trade-title">Ostmine ja müümine (test)</h2>

        <p class="trade-muted">
            Tehinguid kontrollib Python backend.
            Alusta testmängu, et kasutada valitud päeva hindu.
        </p>

        <!-- Mängu alustamine ja aja edasi liigutamine -->
        <div class="trade-row">
            <button id="trade-start">Alusta testmängu</button>

            <button id="trade-next" disabled>
                Järgmine hind (+15 min)
            </button>

            <span id="trade-step" class="trade-muted">–</span>
        </div>

        <!-- Mängu praegune seis -->
        <div class="trade-row trade-info">
            <span>Hetkehind:</span>
            <strong id="trade-price">–</strong>
        </div>

        <div class="trade-row trade-info">
            <span>Mänguaeg:</span>
            <strong id="trade-time">–</strong>
        </div>

        <div class="trade-row trade-info">
            <span>Raha:</span>
            <strong id="trade-balance">–</strong>
        </div>

        <div class="trade-row trade-info">
            <span>Aku:</span>
            <strong id="trade-energy">–</strong>
        </div>

        <hr class="trade-divider">

        <!-- Elektrikoguse valimine -->
        <div class="trade-row">
            <span>Valitud kogus:</span>

            <button id="trade-minus" disabled
                    aria-label="Vähenda kogust">−</button>

            <strong id="trade-quantity">1 MWh</strong>

            <button id="trade-plus" disabled
                    aria-label="Suurenda kogust">+</button>
        </div>

        <!-- Ostmine ja müümine -->
        <div class="trade-row">
            <button id="trade-buy" disabled>OSTA</button>
            <button id="trade-sell" disabled>MÜÜ</button>
        </div>

        <!-- Tehingute teated ja vead -->
        <div id="trade-message"
            class="trade-muted"
            aria-live="polite"></div>

    </div>

  </main>

  <!-- Graafiku teek -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- Meie enda graafiku kood -->
  <script src="js/chart.js"></script>

  <!-- Ostu-müügi nuppude JavaScript -->
  <script src="js/trading.js"></script>

</body>
</html>
