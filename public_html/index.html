<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridrush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100..900&display=swap">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/graph.css">

    <script src="js/battery.js" defer></script>
</head>

<body>
    <nav>
        <ul class="sidebar">
            <li class="sidebar-logo">
                <div class="logo">
                    <img src="img/gridrush-logo-letters.svg" class="logo-letters" alt="">
                    <img src="img/gridrush-logo-lines.svg" class="logo-lines" alt="">
                    <img src="img/gridrush-logo-lines-compact.svg" class="logo-lines-compact" alt="">
                    <img src="img/gridrush-logo-bolt.svg" alt="Gridrush">
                </div>
            </li>
            <li class="sidebar-item">
                <a href="./index.html">
                    <img src="img/nav-simulation-icon.svg" alt="simulation icon">
                    <span>Simulatsioon</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="./setup.html">
                    <img src="img/nav-setup-icon.svg" alt="setup icon">
                    <span>Töölaud</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="./stats.html">
                <img src="img/nav-stats-icon.svg" alt="stats icon">
                <span>Statistika</span>
                </a>
            </li>
            <li class="sidebar-info">
                <a href="./info.html">
                    <img src="img/info.svg" alt="Info">
                    <span>Mängu kohta</span>
                </a>
            </li>
        </ul>
    </nav>

    <main>
        <div class="page-title">
            <h1>Simulatsioon</h1>
        </div>
        
        <div class="simulation-page"> 
            <div class="simulation-graph-wrapper">
                <div class="simulation-graph">
                        <div class="bar">
                            <div>
                                <div class="graph-message">
                                    <div id="graph-message-time"></div>
                                    <div id="graph-message-price" data-trend="Stabiilne"> Laen hindu... </div>
                                    <div id="graph-message-unit"> </div>
                                </div>
                                <div id="stats"></div>
                            </div>
                            <div class="controls">
                                <input type="date" id="date" value="2025-10-02">
                                <button type="button" id="load">Laadi hinnad</button>
                                <button type="button" id="reset" disabled>Reset</button>
                                <button type="button" id="play-pause" class="play-pause-button" aria-label="Käivita" disabled>
                                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                                </button>
                                <div class="speed-buttons" role="group" aria-label="Kiirus">
                                    <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
                                    <button type="button" data-speed="1" aria-pressed="true">1×</button>
                                    <button type="button" data-speed="2" aria-pressed="false">2×</button>
                                    <button type="button" data-speed="5" aria-pressed="false">5×</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div id="price-container">
                                <canvas id="priceChart"></canvas>
                            </div>
                        </div>
                </div>
            </div>
            <div class="buy-sell-container">
                <div class="buy-sell-target">
                    <button type="button" class="target-decrease-button" aria-label="Vähenda">−</button>
                    <div class="target-amount-wrapper">
                        <span class="target-amount">0,0</span>
                        <span class="target-unit">MWh</span>
                    </div>
                    <button type="button" class="target-increase-button" aria-label="Suurenda">+</button>
                </div>
                <div class="battery-buttons">
                    <button type="button" class="battery-buy-button" data-state="charging" data-text="OSTA" aria-pressed="false">OSTA</button>
                    <button type="button" class="battery-sell-button" data-state="discharging" data-text="MÜÜ" aria-pressed="false">MÜÜ</button>
                </div>
            </div>
            <div class="event-container">
                Event
            </div>
        </div>
        
        <div class="right-interface"> 
            <div class="ri-money-container"> 
                <span class="ri-gain-percent">
                    +X%
                </span>
                <div class="ri-money-sum">
                    <span>10.000€</span>
                </div>
            </div>
            <div class="ri-battery">
                <div class="battery-row">
                    <svg class="battery" viewBox="0 0 210 100" fill="none" role="img" aria-label="Aku laetus">
                        <defs>
                            <linearGradient id="battery-shine-grad">
                                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                                <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
                                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                            </linearGradient>
                            <linearGradient id="battery-fill-grad" x2="0" y2="1">
                                <stop offset="0" class="battery-fill-top"/>
                                <stop offset="1" class="battery-fill-bottom"/>
                            </linearGradient>
                            <path id="battery-lines" d="M44.8 16V84M81.6 16V84M118.4 16V84M155.2 16V84" stroke-width="2" stroke-linecap="round"/>
                            <clipPath id="battery-clip"><use href="#battery-fill"/></clipPath>
                        </defs>
                        <rect x="1.25" y="1.25" width="197.5" height="97.5" rx="12" stroke="currentColor" stroke-width="2.5"/>
                        <rect x="198" y="34" width="10" height="32" rx="3" fill="currentColor"/>
                        <use href="#battery-lines" stroke="currentColor" stroke-opacity="0.3"/>
                        <rect id="battery-fill" class="battery-fill" x="8" y="8" width="184" height="84" rx="7" fill="url(#battery-fill-grad)"/>
                        <g clip-path="url(#battery-clip)">
                            <use href="#battery-lines" stroke="#0B1118" stroke-opacity="0.45"/>
                            <rect class="battery-shine" x="-40" width="40" height="100" fill="url(#battery-shine-grad)"/>
                        </g>
                    </svg>
                    <span class="battery-wire" aria-hidden="true"></span>
                    <span class="battery-percent">100%</span>
                </div>
                <span class="battery-capacity"> x / {max} MWh</span>
            </div>
            <div class="ri-automatic">
                Automaatiseerimine
            </div>
            <div class="ri-setup"> 
                Taristu
            </div>
        </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- Meie graafiku JavaScript -->
  <script src="js/chart.js"></script>

</body>

</html>
