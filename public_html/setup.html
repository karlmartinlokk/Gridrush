<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridrush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100..900&display=swap">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/setup.css">

    <script src="js/global.js" defer></script>
    <script src="js/setup.js" defer></script>
</head>

<body>
    <nav>
        <ul class="sidebar">
            <li class="sidebar-logo">
                <div class="logo">
                    <img src="img/logo/gridrush-logo-letters.svg" class="logo-letters" alt="">
                    <img src="img/logo/gridrush-logo-lines.svg" class="logo-lines" alt="">
                    <img src="img/logo/gridrush-logo-lines-compact.svg" class="logo-lines-compact" alt="">
                    <img src="img/logo/gridrush-logo-bolt.svg" alt="Gridrush">
                </div>
            </li>
            <li class="sidebar-item">
                <a href="./index.html">
                    <img src="img/icons/nav-simulation-icon.svg" alt="simulation icon">
                    <span>Simulatsioon</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="./setup.html">
                    <img src="img/icons/nav-setup-icon.svg" alt="setup icon">
                    <span>Töölaud</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="./stats.html">
                <img src="img/icons/nav-stats-icon.svg" alt="stats icon">
                <span>Statistika</span>
                </a>
            </li>
            <li class="sidebar-info">
                <a href="./info.html">
                    <img src="img/icons/info.svg" alt="Info">
                    <span>Mängu kohta</span>
                </a>
            </li>
        </ul>
    </nav>

    <main>
        <div class="page-title">
            <h1>Töölaud</h1>
            <div class="day-controls">
                <div id="day-count" aria-live="polite">Päev -</div>
            </div>
        </div>

        <div class="setup-page">
            <div class="current-setup" id="setup">
                <div class="setup-storage">
                    <div class="setup-battery">
                        <div class="setup-battery-art" id="setup-battery-art"></div>
                        <dl class="setup-battery-info">
                            <dt>Mahutavus</dt>
                            <dd id="setup-battery-capacity"></dd>
                            <dt>Võimsus</dt>
                            <dd id="setup-battery-power"></dd>
                        </dl>
                    </div>
                    <svg class="setup-charge" viewBox="0 0 60 260" fill="none" role="img" aria-label="Aku laetus">
                        <defs>
                            <path id="setup-charge-lines" d="M31 29.6H48M31 54.7H48M31 79.8H48M31 104.9H48M31 130.0H48M31 155.1H48M31 180.2H48M31 205.3H48M31 230.4H48" stroke-width="2" stroke-linecap="round"/>
                            <clipPath id="setup-charge-clip"><use href="#setup-charge-fill"/></clipPath>
                        </defs>
                        <rect x="1.25" y="1.25" width="57.5" height="257.5" rx="12" stroke="currentColor" stroke-width="2.5"/>
                        <use href="#setup-charge-lines" stroke="currentColor" stroke-opacity="0.5"/>
                        <rect id="setup-charge-fill" x="4.5" y="255.5" width="51" height="0" rx="9" fill="url(#battery-fill-grad)"/>
                        <g clip-path="url(#setup-charge-clip)">
                            <use href="#setup-charge-lines" stroke="#0B1118" stroke-opacity="0.45"/>
                        </g>
                    </svg>
                </div>
                <div class="setup-generators">
                    <div class="setup-generator-columns">
                        <div class="setup-generator-column" id="setup-solar">
                            <p class="setup-placeholder">Sinu ostetud<br>päikesepaneelid<br>tekivad siia</p>
                        </div>
                        <div class="setup-generator-column" id="setup-wind">
                            <p class="setup-placeholder">Sinu ostetud<br>tuulikud<br>tekivad siia</p>
                        </div>
                        <span class="setup-generator-total" id="setup-solar-total">0 MW</span>
                        <span class="setup-generator-total" id="setup-wind-total">0 MW</span>
                    </div>
                    <div class="setup-output">
                        <span class="setup-wire" aria-hidden="true"></span>
                        <span id="setup-output-total">0 MW</span>
                        <span class="setup-wire" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
            <h2 class="setup-heading store-heading">
                Pood
                <svg class="store-heading-icon" aria-hidden="true"><use href="img/icons/icons.svg#icon-cart"/></svg>
            </h2>
            <div class="store">
                <div class="store-section buy-batteries">
                    <h2 class="store-title">Akud</h2>
                    <div class="store-row"></div>
                </div>
                <div class="buy-generators">
                    <div class="store-section buy-solar-panels">
                        <h2 class="store-title">Päikesepaneelid</h2>
                        <div class="store-row"></div>
                    </div>
                    <div class="store-section buy-wind-turbines">
                        <h2 class="store-title">Tuulegeneraatorid</h2>
                        <div class="store-row"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-interface"> 
            <div class="ri-money-container"> 
                <span class="ri-gain-percent">
                    +X%
                </span>
                <div class="ri-money-sum">
                    <span>0,00 €</span>
                </div>
            </div>
            <div class="ri-battery">
                <div class="battery-row">
                    <svg class="battery" viewBox="0 0 210 100" fill="none" role="img" aria-label="Aku laetus">
                        <defs>
                            <linearGradient id="battery-shine-grad">
                                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                                <stop offset="0.5" stop-color="#fff" stop-opacity="0.75"/>
                                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
                            </linearGradient>
                            <linearGradient id="battery-fill-grad" x2="0" y2="1">
                                <stop offset="0" class="battery-fill-top"/>
                                <stop offset="1" class="battery-fill-bottom"/>
                            </linearGradient>
                            <path id="battery-lines" d="M44.8 16V84M81.6 16V84M118.4 16V84M155.2 16V84" stroke-width="2" stroke-linecap="round"/>
                            <clipPath id="battery-clip"><use href="#battery-fill"/></clipPath>
                        </defs>
                        <rect x="1.25" y="1.25" width="197.5" height="97.5" rx="12" stroke="currentColor" stroke-width="2.5"/>
                        <rect x="198" y="34" width="10" height="32" rx="3" fill="currentColor"/>
                        <use href="#battery-lines" stroke="currentColor" stroke-opacity="0.3"/>
                        <rect id="battery-fill" class="battery-fill" x="8" y="8" width="0" height="84" rx="7" fill="url(#battery-fill-grad)"/>
                        <text class="battery-label" x="100" y="50">Starter</text>
                        <g clip-path="url(#battery-clip)">
                            <use href="#battery-lines" stroke="#0B1118" stroke-opacity="0.45"/>
                            <text class="battery-label battery-label-dark" x="100" y="50">Starter</text>
                            <rect class="battery-shine" x="-40" width="40" height="100" fill="url(#battery-shine-grad)"/>
                        </g>
                    </svg>
                    <span class="battery-wire" aria-hidden="true"></span>
                    <span class="battery-percent">0%</span>
                </div>
                <span class="battery-capacity"> x / {max} MWh</span>
            </div>
            <div class="ri-automatic">
                Automaatiseerimine
            </div>
            <div class="ri-setup"> 
                Taristu
            </div>
        </div>
    </main>
</body>

</html>
